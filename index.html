// クイズの初期化描画
function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    quizData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        let optionsHTML = '';
        q.options.forEach((opt) => {
            const optVal = opt.charAt(0); // 'a', 'b', 'c', 'd'
            optionsHTML += `
                <li>
                    <label>
                        <input type="radio" name="q${q.id}" value="${optVal}">
                        ${opt}
                    </label>
                </li>
            `;
        });

        card.innerHTML = `
            <div class="question-title">問 ${index + 1}. ${q.question}</div>
            <ul class="options">${optionsHTML}</ul>
            <div id="exp-${q.id}" class="explanation"></div>
        `;
        container.appendChild(card);
    });
}

// 採点機能
function checkAnswers() {
    let score = 0;

    quizData.forEach((q) => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        const expDiv = document.getElementById(`exp-${q.id}`);

        if (selected) {
            if (selected.value === q.answer) {
                score++;
                expDiv.className = 'explanation correct';
                expDiv.innerHTML = `<strong>⭕️ 正解！</strong><br>${q.explanation}`;
            } else {
                expDiv.className = 'explanation incorrect';
                expDiv.innerHTML = `<strong>❌ 不正解...</strong><br>${q.explanation}`;
            }
        } else {
            expDiv.className = 'explanation incorrect';
            expDiv.innerHTML = `<strong>⚠️ 未回答です</strong><br>${q.explanation}`;
        }
        expDiv.style.display = 'block';
    });

    // スコア表示
    const scoreBoard = document.getElementById('score-board');
    const scoreText = document.getElementById('score-text');
    scoreText.innerText = `採点結果: ${score} / ${quizData.length} 点 (${Math.round(score / quizData.length * 100)}%)`;
    scoreBoard.style.display = 'block';
    
    // ページ先頭へスムーズにスクロール
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ページ読み込み時に実行
window.onload = renderQuiz;
