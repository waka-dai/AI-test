      vertical-align: middle;
    }
    .option-list {
      list-style: none;
      padding-left: 0;
      margin: 10px 0;
    }
    .option-list li {
      margin-bottom: 8px;

    label {
      cursor: pointer;
      display: inline-block;
      width: 100%;

      border-radius: 6px;
      border: 1px solid var(--border-color);

      border: none;

      font-size: 1.0rem;
