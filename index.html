<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI入門 小テスト（全40問）</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dddddd;
      --correct-bg: #e6f4ea;
      --incorrect-bg: #fce8e6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    .q-card {
      background: #fafafa;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .q-card.correct { background-color: var(--correct-bg); border-color: #a8dab5; }
    .q-card.incorrect { background-color: var(--incorrect-bg); border-color: #f5c6cb; }
    .q-title {
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 1.05rem;
    }
    .badge-multi {
      background-color: #e65100;
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 5px;
      vertical-align: middle;
    }
    .option-list {
      list-style: none;
      padding-left: 0;
      margin: 10px 0;
    }
    .option-list li {
      margin-bottom: 8px;
    }
    label {
      cursor: pointer;
      display: inline-block;
      width: 100%;
    }
    select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      margin-top: 5px;
      font-size: 0.95rem;
    }
    .match-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    .match-table td {
      padding: 6px 0;
    }
    .btn-submit {
      display: block;
      width: 100%;
      padding: 15px;
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn-submit:hover { opacity: 0.9; }
    #result-box {
      margin-top: 20px;
      padding: 15px;
      background: #e9ecef;
      border-radius: 8px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      display: none;
    }
    .explanation {
      font-size: 0.85rem;
      color: #555;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>AI入門 小テスト（全40問）</h1>
  <form id="quiz-form">
    <div id="quiz-container"></div>
    <button type="button" class="btn-submit" onclick="gradeQuiz()">採点する</button>
  </form>
  <div id="result-box"></div>
</div>
