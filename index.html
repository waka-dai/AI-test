function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    quizData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        let bodyHTML = '';

        if (q.type === "matching") {
            // プルダウン選択型（動画問2などの完全再現）
            bodyHTML += `<table class="matching-table">`;
            q.items.forEach((item, subIndex) => {
                let options = `<option value="">Choose...</option>`;
                q.dropdownOptions.forEach(opt => {
                    options += `<option value="${opt}">${opt}</option>`;
                });
                bodyHTML += `
                    <tr>
                        <td>${item.text}</td>
                        <td><select id="q${q.id}_${subIndex}">${options}</select></td>
                    </tr>
                `;
            });
            bodyHTML += `</table>`;
        } else if (q.type === "multiple") {
            // 複数選択チェックボックス型
            bodyHTML += `<ul class="options-list">`;
            q.options.forEach(opt => {
                const optVal = opt.charAt(0);
                bodyHTML += `
                    <li>
                        <label>
                            <input type="checkbox" name="q${q.id}" value="${optVal}">
                            ${opt}
                        </label>
                    </li>
                `;
            });
            bodyHTML += `</ul>`;
        } else {
            // 単一選択ラジオボタン型
            bodyHTML += `<ul class="options-list">`;
            q.options.forEach(opt => {
                const optVal = opt.charAt(0);
                bodyHTML += `
                    <li>
                        <label>
                            <input type="radio" name="q${q.id}" value="${optVal}">
                            ${opt}
                        </label>
                    </li>
                `;
            });
            bodyHTML += `</ul>`;
        }

        card.innerHTML = `
            <div class="question-title">問 ${index + 1}. ${q.question}</div>
            ${bodyHTML}
            <div id="exp-${q.id}" class="explanation"></div>
        `;
        container.appendChild(card);
    });
}

function checkAnswers() {
    let score = 0;

    quizData.forEach((q) => {
        const expDiv = document.getElementById(`exp-${q.id}`);
        let isCorrect = true;

        if (q.type === "matching") {
            q.items.forEach((item, subIndex) => {
                const selectElem = document.getElementById(`q${q.id}_${subIndex}`);
                if (!selectElem || selectElem.value !== item.answer) {
                    isCorrect = false;
                }
            });
        } else if (q.type === "multiple") {
            const checkedElems = Array.from(document.querySelectorAll(`input[name="q${q.id}"]:checked`)).map(el => el.value);
            if (checkedElems.length !== q.answer.length || !q.answer.every(ans => checkedElems.includes(ans))) {
                isCorrect = false;
            }
        } else {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (!selected || selected.value !== q.answer) {
                isCorrect = false;
            }
        }

        if (isCorrect) {
            score++;
            expDiv.className = 'explanation correct';
            expDiv.innerHTML = `<strong>⭕️ 正解！</strong><br>${q.explanation}`;
        } else {
            expDiv.className = 'explanation incorrect';
            expDiv.innerHTML = `<strong>❌ 不正解...</strong><br>${q.explanation}`;
        }
        expDiv.style.display = 'block';
    });

    const scoreBoard = document.getElementById('score-board');
    const scoreText = document.getElementById('score-text');
    scoreText.innerText = `採点結果: ${score} / ${quizData.length} 点 (${Math.round(score / quizData.length * 100)}%)`;
    scoreBoard.style.display = 'block';
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
